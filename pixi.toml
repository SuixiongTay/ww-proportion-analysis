[project]
name = "ww-proportion-analysis"
version = "0.1.0"
description = "WW composition analysis using pyEQL.equilibrate()"
authors = [{name = "Your Name", email = "your.email@example.com"}]

[dependencies]
python = ">=3.8"
pyeql = ">=0.6.0"
pandas = ">=1.3.0"
numpy = ">=1.21.0"
matplotlib = ">=3.4.0"
monty = ">=2021.0.0"

[dev-dependencies]
pytest = ">=7.0.0"
pytest-cov = ">=3.0.0"
pytest-mock = ">=3.6.0"
black = ">=22.0.0"
flake8 = ">=4.0.0"
mypy = ">=0.950"
isort = ">=5.10.0"
jupyter = ">=1.0.0"
ipython = ">=8.0.0"

[environments]
default = ["python", "pyeql", "pandas", "numpy", "matplotlib", "monty"]
dev = {dependencies = ["default", "pytest", "pytest-cov", "pytest-mock", "black", "flake8", "mypy", "isort", "jupyter", "ipython"]}
test = {dependencies = ["pytest", "pytest-cov", "pytest-mock"]}

[tasks]
test = "pytest -v"
test-cov = "pytest --cov=pyEQL_charge_balance tests/"
lint = "flake8 pyEQL_charge_balance.py tests/"
format = "black pyEQL_charge_balance.py tests/ && isort pyEQL_charge_balance.py tests/"
type-check = "mypy pyEQL_charge_balance.py"
all-checks = {depends_on = ["lint", "type-check", "test"]}
