[workspace]
name = "ww-proportion-analysis"
version = "0.1.0"
authors = ["Sui Xiong Tay <st2591@princeton.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
pandas = ">=1.3.0"
numpy = ">=1.21.0"
pytest = ">=7.0.0"
pytest-cov = ">=3.0.0"
pytest-mock = ">=3.6.0"
black = ">=22.0.0"
ruff = ">=0.1.0"
pre-commit = ">=3.0.0"

[pypi-dependencies]
pyeql = "*"
monty = "*"
matplotlib = "*"

[tasks]
test = "pytest -v"
test-cov = "pytest --cov=pyEQL_charge_balance tests/"
format = "black pyEQL_charge_balance.py tests/ && ruff check --fix pyEQL_charge_balance.py tests/"
lint = "ruff check pyEQL_charge_balance.py tests/"
all-checks = {depends-on = ["lint", "test"]}
